<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cali &amp; Climb Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: single phone-first column, chalk-board neutrals, one colour per day type, fixed bottom nav */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#14202A; --muted:#5A6A75; --line:#D3DADF;
  --accent:#2753D8; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --home:#2753D8; --gym:#B97A0C; --climb:#178A5C; --rest:#7D8C96; --run:#B42D7E;
  --good:#178A5C; --good-soft:#DDF1E8; --caution:#9A6508; --caution-soft:#F7ECD6; --scrim:rgba(20,32,42,.45); --warn:#B3261E;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#162027; --sunk:#111A20; --ink:#E5ECEF; --muted:#93A3AD; --line:#26343D;
  --accent:#7A9BFF; --accent-ink:#0E1418; --accent-soft:#1C2A4A;
  --home:#7A9BFF; --gym:#E2A83C; --climb:#3EC48D; --rest:#6F808B; --run:#E260AE;
  --good:#3EC48D; --good-soft:#163428; --caution:#E2A83C; --caution-soft:#3A2C12; --scrim:rgba(0,0,0,.6); --warn:#FF8A80; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162027; --sunk:#111A20; --ink:#E5ECEF; --muted:#93A3AD; --line:#26343D;
  --accent:#7A9BFF; --accent-ink:#0E1418; --accent-soft:#1C2A4A;
  --home:#7A9BFF; --gym:#E2A83C; --climb:#3EC48D; --rest:#6F808B; --run:#E260AE;
  --good:#3EC48D; --good-soft:#163428; --caution:#E2A83C; --caution-soft:#3A2C12; --scrim:rgba(0,0,0,.6); --warn:#FF8A80; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:14px 104px;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:14px}
fieldset[disabled]{opacity:.55}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
.label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rest);flex:none}
.status[data-k="ok"]::before{background:var(--good)}
.status[data-k="busy"]::before{background:var(--caution)}
.status[data-k="err"]{color:var(--warn)}
.status[data-k="err"]::before{background:var(--warn)}

.datebar{display:flex;align-items:center;gap:8px}
.datebar h1{font-size:30px;line-height:1.05;flex:1;min-width:0}
.datebar .sub{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);display:block;letter-spacing:0}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.text-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wd .dn{font-size:11px;color:var(--muted);font-weight:500}
.wd .dd{font-family:var(--display);font-weight:600;font-size:18px;line-height:1}
.wd[aria-current="date"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd.today .dd{color:var(--accent)}
.marks{display:flex;gap:3px;height:10px;align-items:center}
/* each type has its own shape so it reads without colour: home ● gym ■ climb ▲ rest □ run ○ checklist ▬ */
.mk{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.mk.home{background:var(--home)}
.mk.gym{background:var(--gym);border-radius:1px;width:9px;height:9px}
.mk.climb{background:var(--climb);border-radius:0;width:10px;height:9px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.mk.rest{background:transparent;border-radius:1px;width:8px;height:8px;box-shadow:inset 0 0 0 1.6px var(--rest)}
.mk.run{background:transparent;box-shadow:inset 0 0 0 2px var(--run)}
.mk.st{width:9px;height:3px;border-radius:2px;background:var(--ink);opacity:.6}

/* suggestion */
.sugg{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.srow{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.srow:first-of-type{border-top:0;padding-top:0}
.sdot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--rest)}
.sdot.good{background:var(--good)}
.sdot.easy{background:linear-gradient(90deg,var(--caution) 50%,transparent 50%);box-shadow:inset 0 0 0 1.6px var(--caution)}
.sdot.no{background:transparent;box-shadow:inset 0 0 0 1.6px var(--rest)}
.stext{min-width:0}
.stext b{font-weight:600;display:block}
.stext span{font-size:13px;color:var(--muted)}
.use{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.use[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.banner{background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:500}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-weight:400;font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--accent-ink);border-color:transparent}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.85}
.seg button[data-v="home"][aria-pressed="true"]{background:var(--home)}
.seg button[data-v="gym"][aria-pressed="true"]{background:var(--gym)}
.seg button[data-v="climb"][aria-pressed="true"]{background:var(--climb)}
.seg button[data-v="rest"][aria-pressed="true"]{background:var(--rest)}

.toggles{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 9px;font-size:14px;font-weight:500;cursor:pointer;user-select:none}
.pill input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.pill.run input{accent-color:var(--run)}
.pill small{color:var(--muted);font-weight:400}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h2{font-size:22px}
.note{font-size:13px;color:var(--muted);margin:0}
.warm{font-size:13px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.warm b{font-weight:600}
.tplsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tplsel select{max-width:100%}

.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-weight:600;min-width:0}
.ex-name select{max-width:100%;border:1px solid transparent;background:transparent;font-weight:600;padding:2px 22px 2px 0;margin-left:-1px;border-radius:6px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:right 8px top 55%,right 3px top 55%;background-size:5px 5px;background-repeat:no-repeat;white-space:normal}
.ex-name select:hover{border-color:var(--line)}
.tgt{font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap;color:var(--muted)}
.last{font-size:12px;color:var(--muted)}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.set{display:flex;flex-direction:column;align-items:center;gap:2px}
.set span{font-size:10px;color:var(--muted);letter-spacing:.06em}
.set input{width:62px;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);text-align:center;font-family:var(--display);font-weight:600;font-size:21px;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--muted);opacity:.55}
.set input:focus{background:var(--surface);border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;background:var(--good-soft);color:var(--good);align-self:flex-start}

.checks{display:flex;flex-direction:column}
.group-lbl{margin-top:4px}
.check{display:flex;align-items:center;gap:12px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--good);flex:none}
.check .nm{flex:1;min-width:0}
.check .amt{font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);white-space:nowrap}
.check input:checked ~ .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.progressbar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--good);border-radius:6px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.inp{border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
.inp:focus{background:var(--surface);border-color:var(--accent)}
select.inp{width:auto;max-width:100%}
textarea.inp{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.gym-ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.gym-sets{display:flex;flex-direction:column;gap:6px}
.gset{display:grid;grid-template-columns:28px 1fr 18px 1fr 36px;gap:6px;align-items:center}
.gset .ix{font-size:12px;color:var(--muted);text-align:center}
.gset .x{text-align:center;color:var(--muted)}
.gset input{height:40px;text-align:center;font-family:var(--display);font-weight:600;font-size:19px}
.small-btn{border:1px dashed var(--line);background:transparent;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:500;color:var(--muted)}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;width:36px;height:36px;border-radius:8px;flex:none}
.del:hover{background:var(--sunk);color:var(--warn)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:600}
.danger{border:0;background:var(--warn);color:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.empty{font-size:14px;color:var(--muted);padding:6px 0;margin:0}

/* calendar */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cell{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.cell.out{visibility:hidden}
.cell .dd{font-family:var(--display);font-weight:600;font-size:16px;line-height:1}
.cell.today .dd{color:var(--accent)}
.cell.future{opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* progress */
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;border-top:1px solid var(--line);padding-top:10px;align-items:center}
.prow:first-of-type{border-top:0;padding-top:0}
.prow .pn{font-weight:600;min-width:0}
.prow .pl{font-size:12px;color:var(--muted);grid-column:1}
.prow svg{grid-row:1 / span 2;grid-column:2}

/* timer + feedback */
.sess-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sess-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.clock{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.sess.live{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.sess.done{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.sess-save{font-size:13px;font-weight:600;color:var(--good);display:inline-flex;align-items:center;gap:6px}
.sess-save::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sess-save[data-k="busy"]{color:var(--caution)}
.sess-save[data-k="err"]{color:var(--warn)}
.primary.wide{width:100%;padding:13px 14px;font-size:15px}
.fb{font-size:13px;line-height:1.4;border-radius:9px;padding:7px 10px;background:var(--sunk);color:var(--ink)}
.fb.up{background:var(--accent-soft);color:var(--accent)}
.fb.down{background:var(--caution-soft);color:var(--caution)}
.fb.ok{background:var(--good-soft);color:var(--good)}
.chip.low{background:var(--caution-soft);color:var(--caution)}

/* stopwatch */
.sw-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.sw-btn svg{width:16px;height:16px}
.sw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.sw-time{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;min-width:3ch}
.sw-meta{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;font-size:13px}
.sw-meta b{font-weight:600}
.sw-meta span{color:var(--muted)}
.sw.ready .sw-time{color:var(--muted)}
.sw.hit .sw-time{color:var(--good)}
.sw-actions{display:flex;gap:8px}

/* how-to */
.info{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:13px;line-height:1;flex:none;padding:0;display:inline-grid;place-items:center}
.info:hover{color:var(--accent);border-color:var(--accent)}
.check .info{margin-left:2px}
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:82vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;z-index:21}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-head h2{font-size:26px;line-height:1.1}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.tip{margin:0;font-size:14px;background:var(--caution-soft);color:var(--ink);border-radius:9px;padding:8px 10px}
.ladder{display:flex;flex-wrap:wrap;gap:8px}
.ladder .text-btn{white-space:normal;text-align:left}
.demo{display:block;text-align:center;text-decoration:none;padding:12px 14px}

/* program editor */
.tplchips{display:flex;flex-wrap:wrap;gap:6px}
.tplchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px}
.tplchips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pex{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.pex .inp{background:var(--surface)}
.pex-grid{display:grid;grid-template-columns:repeat(3,1fr) 1.3fr;gap:8px}
.pex-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pex-tools .sp{flex:1}
.pst{display:grid;grid-template-columns:1fr 110px 36px;gap:6px;align-items:center}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sunk);border-radius:10px;padding:10px}
.focus{display:flex;flex-wrap:wrap;gap:6px}
.focus span{font-size:12px;background:var(--sunk);border-radius:999px;padding:3px 9px;color:var(--muted)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

@media (max-width:420px){
  .datebar h1{font-size:26px}
  .seg button{font-size:13px}
  .pex-grid{grid-template-columns:repeat(3,1fr)}
  .pex-grid .unit{grid-column:1 / -1}
  .pst{grid-template-columns:1fr 90px 36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ---------- default program (bodyweight, home) ----------
   Workouts are templates. Each has a "load" on muscle groups, which the
   suggestion logic uses to keep a sensible rotation. */
function X(id,name,sets,min,max,unit,side,easier,harder,other){return {id:id,name:name,sets:sets,min:min,max:max,unit:unit,side:!!side,easier:easier||[],harder:harder||[],other:other||[]};}
function T(name,amt){return {name:name,amt:amt};}
function G(id,name,sets,min,max,side,inc,easier,harder,other){var x=X(id,name,sets,min,max,"reps",side,easier,harder,other);x.inc=inc;return x;}
/* easier: closest version first. harder: next step first. other: sideways swaps. */
var HS_EASY=["Partial wall walk","Elevated pike hold (feet on chair)"],HS_HARD=["Chest-to-wall handstand","Freestanding handstand attempts"];
var HOLLOW_E=["Tuck hollow hold"],HOLLOW_H=["Hollow hold, arms overhead"],HOLLOW_O=["Hollow rocks"];
var SP_E=["Knee side plank"],SP_H=["Elevated side plank (feet on chair)","Elevated side plank, top leg raised"];
var PU_E=["Incline push-ups"],PU_H=["Diamond push-ups","Archer push-ups","Pseudo-planche push-ups"];
var PIKE_E=["Pike push-ups, partial range"],PIKE_H=["Elevated pike push-ups (feet on chair)","Wall handstand push-up negatives"];
var ROW_E=["Towel door rows"],ROW_H=["Feet-elevated table rows","Single-arm table rows"],ROW_O=["Backpack rows"];
var BSS_E=["Split squat"],BSS_H=["Backpack Bulgarian split squat"];
var LSIT_E=["Foot-supported L-sit"],LSIT_H=["One-leg L-sit","L-sit"];
var FROG_E=["Frog stand, toes on floor"],FROG_H=["Crow pose"];
function rawProgram(){
  return {v:2, unit:"lb",
  daily:[T("Wrist circles","30s"),T("Scapular push-ups","×10"),T("Hollow hold","30s"),T("Side plank","20s/side"),T("Deep squat","60s")],
  week:{"1":"push","2":"legs","3":"mob","4":"core","5":"full","6":"skills","0":"fun"},
  tpl:[

   w: what it trains · h: how to do it · m: most common mistake
   Variants point at a base guide with b and add a note in v. */
var GUIDE={
/* handstand family */
"Wall handstand hold":{w:"Shoulders, balance, wrists",h:["Face away from the wall and kick up with one leg, heels resting on the wall.","Hands shoulder-width, fingers spread, about a hand's length from the wall.","Push the floor away, squeeze glutes, and keep your ribs tucked."],m:"Letting the lower back arch into a banana shape. Squeeze glutes and pull ribs in."},
"Partial wall walk":{w:"Shoulders, getting used to being upside down",h:["Start in a push-up position with your feet against the wall.","Walk your feet up the wall while your hands walk back toward it.","Stop at a height that feels okay, hold, then walk back down with control."],m:"Going higher than you feel safe. A little higher each week is the plan."},
"Elevated pike hold (feet on chair)":{w:"Shoulders, the handstand position without the fear",h:["Feet on a chair or couch, hands on the floor.","Walk your hands back until your hips are stacked over your shoulders.","Push the floor away and keep your arms straight by your ears."],m:"Hips drifting behind the hands. Walk the hands closer to the chair."},
"Chest-to-wall handstand":{w:"Shoulders, straight-line handstand position",h:["Walk your feet up the wall, facing it, until your chest is close to the wall.","Hands about 15 cm from the wall, arms locked.","Point your toes, squeeze legs together, and push tall through the shoulders."],m:"Hands too far from the wall, which arches the back. Walk them closer."},
"Freestanding handstand attempts":{w:"Balance",h:["Kick up gently in open space with a soft landing area.","Balance with your fingertips: press them to stop falling forward.","Practise bailing out first: twist and step one hand sideways like a cartwheel."],m:"Kicking too hard. Small, controlled kicks build balance faster."},
/* push-ups */
"Push-ups":{w:"Chest, shoulders, triceps, core",h:["Hands just wider than shoulders, body in a straight line from head to heels.","Lower until your chest is a fist's height from the floor, elbows about 45° from your body.","Push back up without letting your hips sag."],m:"Hips sagging or piking. Squeeze glutes and brace like a plank."},
"Incline push-ups":{b:"Push-ups",v:"Hands on a bench, counter or wall. The higher the hands, the easier it is."},
"Archer push-ups":{w:"Chest, one-arm pushing strength",h:["Hands set very wide.","Lower toward one hand while the other arm straightens out to the side.","Push back up and alternate sides."],m:"Letting the straight arm do the work. Keep most of your weight on the bending arm."},
"Pseudo-planche push-ups":{w:"Front shoulders, straight-arm strength for planche",h:["Hands by your waist with fingers turned out or back.","Lean your shoulders well in front of your hands.","Keep that lean as you lower and press back up."],m:"Losing the lean at the bottom. Keep the shoulders forward the whole rep."},
"Diamond push-ups":{w:"Triceps, inner chest",h:["Hands together under your chest, thumbs and index fingers touching.","Lower with elbows close to your sides.","Press back up, body straight."],m:"Elbows flaring out wide. Keep them tucked."},
"Close-grip incline push-ups":{b:"Diamond push-ups",v:"Hands close together on a bench or counter. Easier than the floor version."},
"Close-grip pseudo-planche push-ups":{b:"Pseudo-planche push-ups",v:"Hands close together, which puts more work on the triceps."},
"Pike push-ups":{w:"Shoulders, the path to handstand push-ups",h:["Hips high in an upside-down V, hands shoulder-width.","Lower the top of your head toward a spot in front of your hands.","Press back up to straight arms."],m:"Bending elbows straight out to the sides. Aim them back at about 45°."},
"Pike push-ups, partial range":{b:"Pike push-ups",v:"Only lower halfway, or put a pillow under your head to shorten the range. Go deeper as you get stronger."},
"Elevated pike push-ups (feet on chair)":{b:"Pike push-ups",v:"Feet on a chair so more of your weight is over your hands. Hips stay stacked over shoulders."},
"Wall handstand push-up negatives":{w:"Shoulders, handstand push-up strength",h:["Kick up into a wall handstand.","Lower your head toward the floor as slowly as you can, 3 to 5 seconds.","Come down, then kick up for the next rep."],m:"Dropping fast at the bottom. Put a folded towel under your head."},
/* rows */
"Table rows":{w:"Upper back, biceps, balances push-ups",h:["Lie under a sturdy table and grip the edge with hands shoulder-width.","Body straight, heels on the floor.","Pull your chest to the table edge, then lower slowly."],m:"Using a table that tips. Test it first. Hips sagging is the other common one."},
"Towel door rows":{b:"Table rows",v:"Loop a towel around both handles of a closed, sturdy door. Lean back holding the ends and row yourself in. More upright = easier."},
"Feet-elevated table rows":{b:"Table rows",v:"Feet on a chair so your body is level. Harder than heels on the floor."},
"Single-arm table rows":{b:"Table rows",v:"Pull with one arm while the other rests on your chest. Don't let your body twist."},
"Backpack rows":{w:"Upper back",h:["Load a backpack with books and hold it by the top handle.","Hinge forward with a flat back, one hand on a chair.","Pull the bag to your hip, pause, and lower slowly."],m:"Rounding the back. Hinge at the hips and keep the chest proud."},
/* side planks */
"Side plank":{w:"Obliques, side of the core, flag prep",h:["Elbow under your shoulder, feet stacked.","Lift your hips so your body is a straight line.","Push the floor away with your forearm and breathe."],m:"Hips sagging or drifting back. Imagine a wall behind you."},
"Knee side plank":{b:"Side plank",v:"Knees bent and on the floor. Easier, same straight line from head to knees."},
"Elevated side plank (feet on chair)":{b:"Side plank",v:"Feet on a chair. Harder, and closer to the line of a human flag."},
"Elevated side plank, top leg raised":{b:"Side plank",v:"Feet on a chair, then lift the top leg and hold. A big step toward flag strength."},
"Side plank, top leg raised":{b:"Side plank",v:"Lift the top leg and hold it while keeping hips high."},
"Side plank leg raises":{w:"Obliques and the outer hip",h:["Set up a side plank on your elbow.","Lift the top leg up and lower it slowly.","Keep the hips high the whole set."],m:"Hips dropping each time the leg lifts."},
"Knee side plank leg raises":{b:"Side plank leg raises",v:"Bottom knee on the floor. Easier."},
"Elevated side plank leg raises":{b:"Side plank leg raises",v:"Bottom foot on a chair. Much harder."},
/* legs */
"Box pistol to chair":{w:"Single-leg strength",h:["Stand on one leg in front of a chair, the other leg out in front.","Sit back slowly onto the chair, controlling the whole way down.","Stand back up on the same leg without rocking."],m:"Dropping onto the chair. Control the last few centimetres."},
"Assisted pistol squat":{b:"Box pistol to chair",v:"Hold a door frame or table and squat on one leg to full depth, using your arms only as much as you need."},
"Box pistol to low step":{b:"Box pistol to chair",v:"Use something lower than a chair, like a stair or a stack of books."},
"Pistol squat":{w:"Single-leg strength, ankle and hip mobility",h:["Stand on one leg, other leg straight out in front.","Squat all the way down with your arms reaching forward for balance.","Stand up without the knee caving in."],m:"Heel lifting. Hold a light weight out front to counterbalance."},
"Shrimp squat":{w:"Single-leg strength, quads",h:["Stand on one leg and hold the other foot behind you.","Lower until the back knee touches the floor.","Drive back up through the front foot."],m:"Leaning way forward. Keep the chest up."},
"Bulgarian split squat":{w:"Quads, glutes, balance",h:["Back foot on a chair, front foot far enough out that the knee stays over the foot.","Lower straight down until the back knee nearly touches the floor.","Push up through the front heel."],m:"Front foot too close, so the heel lifts. Step it out further."},
"Split squat":{b:"Bulgarian split squat",v:"Both feet on the floor in a long stance. Easier and better for balance."},
"Backpack Bulgarian split squat":{b:"Bulgarian split squat",v:"Wear a loaded backpack to add weight."},
"Single-leg calf raises":{w:"Calves, ankles, helps with running",h:["Stand on one foot on a step edge, holding something for balance.","Rise all the way onto your toes.","Lower slowly until your heel drops below the step."],m:"Bouncing. Use the full range and go slow."},
"Double-leg calf raises":{b:"Single-leg calf raises",v:"Both feet. Easier."},
"Backpack single-leg calf raises":{b:"Single-leg calf raises",v:"Wear a loaded backpack to add weight."},
"Glute bridge":{w:"Glutes, hamstrings",h:["Lie on your back, knees bent, feet flat near your hips.","Drive through your heels to lift your hips.","Squeeze glutes at the top for a second, then lower."],m:"Arching the lower back instead of squeezing the glutes."},
"Single-leg glute bridge":{b:"Glute bridge",v:"One foot on the floor, the other leg straight in the air. Hips stay level."},
"Hip thrust (shoulders on couch)":{b:"Glute bridge",v:"Upper back on the edge of a couch for a bigger range of motion."},
"Squats":{w:"Legs",h:["Feet shoulder-width, toes slightly out.","Sit down and back until your thighs are at least parallel.","Stand up, knees tracking over your toes."],m:"Knees caving in."},
/* core */
"Hollow hold":{w:"Core tension, used in almost every skill",h:["Lie on your back and press your lower back into the floor.","Lift shoulders and legs a few centimetres off the floor, arms by your sides or overhead.","Hold, breathing shallowly, without letting the back lift."],m:"Lower back peeling off the floor. Bend knees or raise legs higher until it stays down."},
"Tuck hollow hold":{b:"Hollow hold",v:"Knees bent toward your chest. Easier, same flat lower back."},
"Hollow hold, arms overhead":{b:"Hollow hold",v:"Arms straight by your ears. The longer lever makes it harder."},
"Hollow rocks":{b:"Hollow hold",v:"Hold the hollow shape and rock gently back and forth like a banana. Don't let the shape break."},
"Tuck L-sit":{w:"Core, hip flexors, triceps, shoulder depression",h:["Hands on the floor, parallettes or dumbbells beside your hips.","Push down hard and lift your hips off the floor.","Pull your knees up toward your chest and hold."],m:"Shrugging. Push your shoulders down away from your ears."},
"Foot-supported L-sit":{b:"Tuck L-sit",v:"Lift your hips while your heels stay lightly on the floor. Builds the push-down strength first."},
"One-leg L-sit":{b:"Tuck L-sit",v:"One leg tucked, the other straight out. Switch legs each set."},
"L-sit":{b:"Tuck L-sit",v:"Both legs straight out in front, parallel to the floor."},
"Reverse plank":{w:"Glutes, back of the shoulders",h:["Sit with legs straight and hands behind your hips, fingers pointing to your feet.","Lift your hips until your body is a straight line.","Squeeze glutes and look up at the ceiling."],m:"Hips sagging. Squeeze glutes harder."},
"Reverse tabletop":{b:"Reverse plank",v:"Knees bent, feet flat, so your body forms a table. Easier."},
"Reverse plank, one leg raised":{b:"Reverse plank",v:"Lift one leg and hold. Harder."},
/* balance */
"Frog stand":{w:"Balance, wrists, the first step toward handstands",h:["Squat down with hands flat on the floor, shoulder-width.","Rest your knees on the backs of your upper arms.","Lean forward slowly until your feet float. Grip with your fingertips to stop tipping."],m:"Not leaning far enough. Put a pillow in front of your face so it feels safe to lean."},
"Frog stand, toes on floor":{b:"Frog stand",v:"Keep your toes lightly touching the floor while you shift weight onto your hands."},

"Crow pose, straighter arms":{b:"Crow pose",v:"Push the floor away to straighten your arms more. Harder."},

"Back squat":{w:"Quads, glutes, overall leg strength",h:["Bar on your upper back, feet shoulder-width, toes slightly out.","Brace your core, then sit down between your hips until thighs are at least parallel.","Drive up, keeping your chest up and knees over your toes."],m:"Knees caving in or the chest folding forward. Lighten the bar until it's clean."},

"Dumbbell Bulgarian split squat":{b:"Bulgarian split squat",v:"Hold a dumbbell in each hand."},
"Dumbbell split squat":{b:"Bulgarian split squat",v:"Both feet on the floor, dumbbells in hand. Easier for balance."},
"Barbell Bulgarian split squat":{b:"Bulgarian split squat",v:"Bar on your back. Lets you load it heavier."},
"Lying leg curl":{w:"Hamstrings",h:["Lie face down with the pad just above your heels.","Curl your heels toward your glutes.","Lower slowly for 2 to 3 seconds."],m:"Hips lifting off the pad to swing the weight."},
"Seated leg curl":{b:"Lying leg curl",v:"Same curl sitting down."},
"Nordic curl negatives":{w:"Hamstrings, strongly protective against strains",h:["Kneel with your ankles anchored.","Keep your body straight and lower forward as slowly as you can.","Catch yourself with your hands and push back up."],m:"Bending at the hips. Keep a straight line from knees to head."},

function normalizeProgram(p){
  var def=defaultProgram();
  if(!p||p.v!==2||!Array.isArray(p.tpl)){var u=p&&p.unit;if(u)def.unit=u;return def;}
  p.daily=p.daily||[];p.week=p.week||def.week;p.unit=p.unit||"lb";
  var defEx={};def.tpl.forEach(function(t){t.ex.forEach(function(x){defEx[x.id]=x;});});
  p.tpl.forEach(function(t){t.ex=t.ex||[];t.st=t.st||[];t.load=t.load||{};
    t.ex.forEach(function(x){
      if(!x.easier&&!x.harder){var dx=defEx[x.id];x.easier=dx?dx.easier.slice():[];x.harder=dx?dx.harder.slice():[];
        x.other=(x.subs||[]).filter(function(n){return x.easier.indexOf(n)<0&&x.harder.indexOf(n)<0;});}
      x.easier=x.easier||[];x.harder=x.harder||[];x.other=x.other||[];delete x.subs;
    });});
  if(!Array.isArray(p.gtpl))p.gtpl=def.gtpl;
  p.gtpl.forEach(function(t){t.ex=t.ex||[];t.st=t.st||[];t.load=t.load||{};t.kind=t.kind||"strength";
    t.ex.forEach(function(x){x.easier=x.easier||[];x.harder=x.harder||[];x.other=x.other||[];x.unit="reps";if(typeof x.inc!=="number")x.inc=5;});});
  return p;
}
/* versions of an exercise, easiest to hardest, with the main one in the middle */
function ladder(x){return (x.easier||[]).slice().reverse().concat([x.name],x.harder||[]);}
function allNames(x){var out=[];ladder(x).concat(x.other||[]).forEach(function(n){if(n&&out.indexOf(n)<0)out.push(n);});return out;}
function steps(x,cur){var L=ladder(x),i=L.indexOf(cur);if(i<0)return {up:null,down:null};return {up:L[i+1]||null,down:L[i-1]||null};}
function stepsByName(name){var ts=S.program.tpl.concat(S.program.gtpl||[]);for(var i=0;i<ts.length;i++)for(var j=0;j<ts[i].ex.length;j++){var x=ts[i].ex[j];if(ladder(x).indexOf(name)>=0)return steps(x,name);}return {up:null,down:null};}
/* live advice from the numbers entered for one exercise */
function feedback(x,rec){
  var cur=(rec&&rec.name)||x.name,st=steps(x,cur),sec=x.unit==="sec",u=sec?" s":"";
  var v=((rec&&rec.sets)||[]).slice(0,x.sets).filter(filled).map(Number);if(!v.length||x.min===x.max&&x.sets===1)return null;
  var done=v.length>=x.sets,genUp=sec?"Hold past the range, or add a harder version under Program.":"Slow the lowering to 3 seconds, or add a harder version under Program.";
  var avg=v.reduce(function(a,b){return a+b;},0)/v.length;
  if(done&&v.every(function(a){return a>=x.max;}))return {k:"up",t:"Every set hit the top of the range. "+(st.up?"Move to "+st.up+" next time.":genUp)};
  if(!done&&v[0]>=Math.ceil(x.max*1.3))return {k:"up",t:"First set was well above the range ("+v[0]+u+"). "+(st.up?"Switch to "+st.up+" for the rest.":genUp)};
  if(done&&avg<x.min)return {k:"down",t:"Below the range today. "+(st.down?"Try "+st.down+" next time and build back up.":"Stick with it and aim for "+(sec?"a few more seconds":"one more rep")+" next time.")};
  if(!done&&v[0]<Math.max(1,Math.floor(x.min*.6)))return {k:"down",t:"Well under the range. "+(st.down?"Switch to "+st.down+" for the rest.":"Shorter sets with clean form are fine. You'll build up.")};
  if(done)return {k:"ok",t:"In range. Beat one number next time."};
  return null;
}

function gymExByName(n){var a=S.program.gtpl||[];for(var i=0;i<a.length;i++)for(var j=0;j<a[i].ex.length;j++)if(ladder(a[i].ex[j]).indexOf(n)>=0)return a[i].ex[j];return null;}
function tplOfEntry(e){

  for(var i=0;i<S.program.tpl.length;i++){var tt=S.program.tpl[i];if(tt.ex.some(function(x){return ids.indexOf(x.id)>=0;}))return tt;}

/* stretch checklist = every-day essentials + the day's stretches (deduped by name) */
function stretchList(d,e){

  function add(list,g){(list||[]).forEach(function(s){var k=s.name.trim().toLowerCase();if(!k||seen[k])return;seen[k]=1;out.push({name:s.name,amt:s.amt,g:g});});}
  add(S.program.daily,"daily");

function allDays(){var out=[];for(var k in S.months){var ds=(S.months[k]&&S.months[k].days)||{};for(var d in ds)out.push([d,ds[d]]);}out.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0;});return out;}
var HC=null,SC={};
function hist(){
  if(HC)return HC;
  var home={},gym={};
  allDays().forEach(function(p){var d=p[0],e=p[1];
    var ex=e.ex||{};
    for(var id in ex){var r=ex[id];if(!r||!r.name)continue;var vals=(r.sets||[]).filter(filled);if(!vals.length)continue;(home[r.name]=home[r.name]||[]).push({d:d,sets:r.sets,tgt:r.tgt,unit:r.unit});}
    (e.gym||[]).forEach(function(g){if(!g||!g.name)return;var ok=(g.sets||[]).filter(function(s){return s&&(filled(s.w)||filled(s.r));});if(!ok.length)return;(gym[g.name.trim()]=gym[g.name.trim()]||[]).push({d:d,sets:ok});});
  });
  HC={home:home,gym:gym};return HC;
}

}

/* ---------- suggestions ---------- */
function dayLoad(e){
  var L={},hard=false,active=false;
  function add(o,m){for(var g in o)L[g]=(L[g]||0)+o[g]*(m||1);}
  if(!e)return {L:L,hard:false,active:false};
  if(e.type==="climb"){add(LOAD.climb);hard=true;active=true;}
  if(gymDone(e)){var gt=gtplById(e.gtpl);add(gt?gt.load:LOAD.gym);hard=true;active=true;}
  if((e.type==="home"||e.alsoHome)&&homeDone(e)){
    active=true;
    if(e.min&&!anySets(e.ex))add({core:.5});
    else{var t=tplOfEntry(e);if(t){add(t.load);if(t.kind==="strength")hard=true;}}
  }
  if(e.run){add(LOAD.run);active=true;}
  return {L:L,hard:hard,active:active};
}
function daysSince(pred,d,max){for(var i=1;i<=(max||30);i++){var e=getEntry(addDays(d,-i));if(e&&pred(e))return i;}return null;}
function topGroup(L){var g=null,v=1.5;for(var k in L)if(L[k]>=v){v=L[k];g=k;}return g;}
function suggest(d){
  if(SC[d])return SC[d];
  var e1=getEntry(addDays(d,-1)),y=dayLoad(e1),y2=dayLoad(getEntry(addDays(d,-2))),F={},g;
  for(g in y.L)F[g]=(F[g]||0)+y.L[g];
  for(g in y2.L)F[g]=(F[g]||0)+.5*y2.L[g];
  var hardStreak=0,actStreak=0,i;
  for(i=1;i<=14;i++){if(dayLoad(getEntry(addDays(d,-i))).hard)hardStreak++;else break;}
  for(i=1;i<=14;i++){if(dayLoad(getEntry(addDays(d,-i))).active)actStreak++;else break;}
  var tired=hardStreak>=3||actStreak>=6;
  var yT=e1&&homeDone(e1)&&!e1.min?tplOfEntry(e1):null;
  var weekT=S.program.week[String(dowOf(d))];
  var best=null;
  S.program.tpl.forEach(function(t){
    var cost=0;for(var k in t.load)cost+=(F[k]||0)*t.load[k];
    var ds=daysSince(function(e){var tt=homeDone(e)&&tplOfEntry(e);return tt&&tt.id===t.id;},d,30);
    var rec=ds==null?8:Math.min(ds,8);
    var base={strength:0,skill:1,light:4,recovery:6}[t.kind]||0;
    if(tired){if(t.kind==="recovery")base-=9;else if(t.kind==="light")base-=4;else if(t.kind==="strength")base+=3;}
    var score=cost-rec+base+(yT&&yT.id===t.id?10:0)+(t.id===weekT?-.5:0);
    if(!best||score<best.score)best={t:t,score:score,ds:ds};
  });
  var reason;
  if(tired&&best.t.kind!=="strength")reason=hardStreak>=3?hardStreak+" hard days in a row. Go easy today.":actStreak+" active days in a row. Go easy today.";
  else{
    var parts=[],top=topGroup(y.L);
    if(e1&&e1.type==="climb"&&!((best.t.load.pull||0)>=2))parts.push("You climbed yesterday, so this skips heavy pulling.");
    else if(top&&!((best.t.load[top]||0)>=2))parts.push("Yesterday worked your "+GROUP[top]+", so this trains something else.");
    if(best.ds==null)parts.push("You haven't done this one yet.");
    else if(best.ds>=3)parts.push("Last done "+best.ds+" days ago.");
    if(!parts.length)parts.push("Next up in your rotation.");
    reason=parts.join(" ");
  }
  // gym
  var yG=e1&&gymDone(e1)?e1.gtpl:null,gBest=null;
  (S.program.gtpl||[]).forEach(function(t){
    var cost=0;for(var k in t.load)cost+=(F[k]||0)*t.load[k];
    var ds=daysSince(function(e){return gymDone(e)&&e.gtpl===t.id;},d,30);
    var rec=ds==null?8:Math.min(ds,8);
    var score=cost*1.5-rec+(yG===t.id?10:0);
    if(!gBest||score<gBest.score)gBest={t:t,score:score,ds:ds};
  });

  if(gBest){

    if(gBest.ds==null)gp.push("You haven't done this one yet.");else if(gBest.ds>=3)gp.push("Last done "+gBest.ds+" days ago.");
    if(!gp.length)gp.push("Next up in your gym rotation.");

  }
  // climbing
  var dc=daysSince(function(e){return e.type==="climb";},d,30),climb;
  if(dc===1)climb={s:"no",t:"Skip climbing",r:"You climbed yesterday. Give your fingers a day off."};

  else climb={s:"good",t:"Good day to climb",r:dc==null?"No climbing logged recently.":"Last session was "+dc+" days ago."};
  // running
  var mon=mondayOf(d),runs=0;for(var k2=mon;k2<d;k2=addDays(k2,1)){var ee=getEntry(k2);if(ee&&ee.run)runs++;}
  var legsY=(y.L.legs||0)>=2,ranY=!!(e1&&e1.run),run;
  if(legsY)run={s:"easy",t:"Easy run only, or skip",r:"Your legs worked hard yesterday."};
  else if(runs>=3)run={s:"no",t:"Skip the run",r:runs+" runs this week already. That's plenty while you build up."};
  else if(ranY)run={s:"easy",t:"Short easy run if anything",r:"You ran yesterday. A day off between runs helps your shins."};
  else run={s:"good",t:"Good day for an easy run",r:runs?runs+" run"+(runs>1?"s":"")+" so far this week.":"No runs yet this week."};
  var rest=actStreak>=6?actStreak+" active days in a row. Consider a rest or mobility day.":null;
  SC[d]={t:best.t,reason:reason,gym:gym,climb:climb,run:run,rest:rest};
  return SC[d];
}

var DB=null,BASE=null,timers={},inflight={},dirty={},retried={};
var LS_KEY="cali-climb-log-v1";

function docBody(id){return id==="program"?clone(S.program):clone(S.months[id]||{days:{}});}
function busy(id){return !!(dirty[id]||inflight[id]||timers[id]);}
function persist(id){HC=null;SC={};dirty[id]=true;clearTimeout(timers[id]);timers[id]=setTimeout(function(){timers[id]=null;flush(id);},500);setStatus("busy","Saving…");}
function anyBusy(){for(var k in dirty)if(busy(k))return true;return false;}
function flush(id){
  if(inflight[id]||!dirty[id])return;
  dirty[id]=false;inflight[id]=true;
  if(S.mode!=="db"){var ok=localSave();inflight[id]=false;setStatus(ok?"ok":"err",ok?"Saved on this device only":"Couldn't save on this device");return;}
  DB.doc(BASE+"/"+id).set(docBody(id)).then(function(){
    retried[id]=false;inflight[id]=false;
    if(dirty[id])timers[id]=setTimeout(function(){timers[id]=null;flush(id);},500);
    else if(!anyBusy())setStatus("ok","Saved to your account");
  }).catch(function(err){
    inflight[id]=false;dirty[id]=true;var code=err&&err.code;
    if((code==="unavailable"||code==="resource_exhausted")&&!retried[id]){retried[id]=true;timers[id]=setTimeout(function(){timers[id]=null;flush(id);},1500+Math.random()*1000);return;}
    setStatus("err",code==="quota_exceeded"?"Storage is full. Your latest change wasn't saved.":code==="revoked"?"Saving stopped. Reload the page.":"Couldn't save. Edit again to retry.");
  });
}
function flushAll(){for(var k in timers){if(timers[k]){clearTimeout(timers[k]);timers[k]=null;flush(k);}}}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")flushAll();});

var pendingRender=false;

root.addEventListener("focusout",function(){setTimeout(function(){if(pendingRender&&!editing()){pendingRender=false;render();}},0);});

function onSnap(snap){
  var changed=false;
  snap.docs.forEach(function(doc){
    var id=doc.id;if(busy(id)||doc.metadata.hasPendingWrites)return;
    var data=clone(doc.data()||{});
    if(id==="program"){var np=normalizeProgram(data);if(JSON.stringify(np)!==JSON.stringify(S.program)){S.program=np;changed=true;}}
    else if(id.indexOf("m-")===0){if(JSON.stringify(data)!==JSON.stringify(S.months[id])){S.months[id]=data;changed=true;}}
  });
  if(!S.loaded){S.loaded=true;changed=true;if(!anyBusy())setStatus("ok","Saved to your account");}
  if(changed){HC=null;SC={};safeRender();}
}
function goLocal(why){S.mode="local";localLoad();S.loaded=true;setStatus("ok",why||"Saved on this device only");render();}
function initStore(){
  if(!window.claude||typeof window.claude.use!=="function"){goLocal();return;}
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user){goLocal();return;}
    return Promise.resolve(user.id()).then(function(id){
      if(!id){goLocal("Sign in to save to your account. Saving on this device only.");return;}
      DB=db;BASE="data/users/"+id;S.mode="db";
      DB.collection(BASE).onSnapshot(onSnap,function(err){
        if(err&&err.code==="unavailable"){setTimeout(function(){DB.collection(BASE).onSnapshot(onSnap,function(){setStatus("err","Lost connection. Reload the page.");});},2000);}
        else setStatus("err","Lost connection. Reload the page.");
      });
      setTimeout(function(){if(!S.loaded){S.loaded=true;setStatus("ok","Saved to your account");render();}},8000);
    });
  }).catch(function(){goLocal();});
}

    return '<div class="sw'+(ready?" ready":hit?" hit":"")+'" id="sw-box"><span class="sw-time" id="sw-time">'+(ready?Math.max(1,Math.ceil((SW.readyEnd-Date.now())/1000)):sec)+'</span><div class="sw-meta"><b id="sw-label">'+(ready?"Get in position…":"Set "+(SW.set+1)+" · holding")+'</b><span>Target '+x.min+'–'+x.max+' s. Beeps at '+x.min+' s and '+x.max+' s.</span></div><div class="sw-actions"><button class="primary" data-act="sw-stop">'+(ready?"Cancel":"Stop")+'</button></div></div>';

  if(!SW)return;var el=document.getElementById("sw-time"),box=document.getElementById("sw-box"),lab=document.getElementById("sw-label");
  if(!SW.t0){
    if(Date.now()>=SW.readyEnd){SW.t0=SW.readyEnd;beep(880,180);if(box)box.className="sw";if(lab)lab.textContent="Set "+(SW.set+1)+" · holding";var bt=box&&box.querySelector("button");if(bt)bt.textContent="Stop";}
    else{if(el)el.textContent=Math.max(1,Math.ceil((SW.readyEnd-Date.now())/1000));return;}
  }
  var s=swSecs();if(el)el.textContent=s;
  if(s>=SW.min&&!SW.b1){SW.b1=1;beep(660,160);if(box)box.className="sw hit";}
  if(s>=SW.max&&!SW.b2){SW.b2=1;beep(990,140);beep(990,140,.22);}

}

      h+='<div class="field"><label for="pmin-'+id+'">Min</label><input id="pmin-'+id+'" class="inp num" type="number" min="0" data-in="pex" data-id="'+id+'" data-f="min" value="'+x.min+'"></div>';
      h+='<div class="field"><label for="pmax-'+id+'">Max</label><input id="pmax-'+id+'" class="inp num" type="number" min="0" data-in="pex" data-id="'+id+'" data-f="max" value="'+x.max+'"></div>';
      if(gymT)h+='<div class="field unit"><label for="pi-'+id+'">Weight jump ('+esc(wUnit())+')</label><input id="pi-'+id+'" class="inp num" type="number" min="0" step="any" data-in="pex" data-id="'+id+'" data-f="inc" value="'+incFor(x)+'"></div></div>';
      else h+='<div class="field unit"><label for="pu-'+id+'">Measured in</label><select id="pu-'+id+'" class="inp" data-ch="pex-unit" data-id="'+id+'"><option value="reps"'+(x.unit==="reps"?" selected":"")+'>Reps</option><option value="sec"'+(x.unit==="sec"?" selected":"")+'>Seconds</option></select></div></div>';
      h+='<div class="field"><label for="pe-'+id+'">Easier versions, closest first (comma separated)</label><input id="pe-'+id+'" class="inp" data-in="pex" data-id="'+id+'" data-f="easier" value="'+esc((x.easier||[]).join(", "))+'" placeholder="e.g. Incline push-ups"></div>';
      h+='<div class="field"><label for="ph-'+id+'">Harder versions, next step first</label><input id="ph-'+id+'" class="inp" data-in="pex" data-id="'+id+'" data-f="harder" value="'+esc((x.harder||[]).join(", "))+'" placeholder="e.g. Archer push-ups"></div>';
      h+='<div class="field"><label for="po-'+id+'">Other swaps</label><input id="po-'+id+'" class="inp" data-in="pex" data-id="'+id+'" data-f="other" value="'+esc((x.other||[]).join(", "))+'" placeholder="Same difficulty, different movement"></div>';
      h+='<div class="pex-tools"><label class="pill"><input type="checkbox" data-ch="pex-side" data-id="'+id+'"'+(x.side?" checked":"")+'> Per side</label><span class="sp"></span><button class="icon-btn" data-act="pex-up" data-id="'+id+'" aria-label="Move up"'+(i===0?" disabled":"")+'>↑</button><button class="icon-btn" data-act="pex-down" data-id="'+id+'" aria-label="Move down"'+(i===p.ex.length-1?" disabled":"")+'>↓</button><button class="icon-btn" data-act="pex-del" data-id="'+id+'" aria-label="Remove exercise">×</button></div></div>';
    });
    h+='<button class="primary" data-act="pex-add">+ Add exercise</button></section>';
    h+='<section class="card"><div class="card-head"><h2>Stretches</h2><span class="label num">'+p.st.length+'</span></div><p class="note">Shown under the every-day essentials when you do this workout. Duplicates of the essentials are skipped.</p>'+stretchRows(p.st)+'<button class="small-btn" data-act="pst-add">+ Add stretch</button></section>';
  }
  h+='<section class="card"><div class="card-head"><h2>Settings</h2></div><div class="field"><label for="p-unit">Gym weight unit</label><select id="p-unit" class="inp" data-ch="unit"><option value="lb"'+(S.program.unit==="lb"?" selected":"")+'>Pounds (lb)</option><option value="kg"'+(S.program.unit==="kg"?" selected":"")+'>Kilograms (kg)</option></select></div>';
  h+=S.confirmReset?'<div class="confirm"><span>Reset every workout and the essentials to the original program? Your logs stay.</span><button class="danger" data-act="reset-yes">Reset program</button><button class="text-btn" data-act="reset-no">Cancel</button></div>':'<button class="small-btn" data-act="reset">Reset program to original</button>';
  return h+'</section></fieldset>';
}

function render(){
  HC=null;SC={};
  var y=window.scrollY;
  var body=S.tab==="today"?viewToday():S.tab==="cal"?viewCalendar():S.tab==="prog"?viewProgress():viewProgram();
  root.innerHTML='<div class="wrap"><div class="top"><span class="brand">Cali &amp; Climb Log</span><span class="status" id="status" data-k="'+statusState.k+'">'+esc(statusState.t)+'</span></div>'+body+'</div>'+
    '<nav class="nav" aria-label="Sections"><div class="nav-in">'+[["today","Today"],["cal","Calendar"],["prog","Progress"],["plan","Program"]].map(function(t){return '<button data-act="tab" data-v="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':"")+'>'+t[1]+'</button>';}).join("")+'</div></nav>';
  if(S.info)root.insertAdjacentHTML("beforeend",sheetHtml());
  if(document.body)document.body.style.overflow=S.info?"hidden":"";
  window.scrollTo(0,y);
  if(S.info){var cb=document.getElementById("sheet-close");if(cb&&cb.focus)cb.focus();}
}

/* ---------- events ---------- */
function editList(){return S.progTpl==="daily"?S.program.daily:tplById(S.progTpl).st;}
function exById(id){var p=tplById(S.progTpl);if(!p)return null;for(var i=0;i<p.ex.length;i++)if(p.ex[i].id===id)return {p:p,i:i,x:p.ex[i]};return null;}
function planEx(d,id,mode){var list=mode==="m"?MIN_EX:curTpl(d,getEntry(d)).ex;for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null;}
function recFor(d,e,x,mode){
  if(mode!=="m"&&!e.tpl)e.tpl=curTpl(d,e).id;
  var bag=mode==="m"?(e.mx=e.mx||{}):(e.ex=e.ex||{});
  if(!bag[x.id])bag[x.id]={name:x.name,sets:[]};
  var r=bag[x.id];r.unit=x.unit;r.tgt={sets:x.sets,min:x.min,max:x.max};return r;
}

root.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.dataset.act,d=S.date,e;
  if(a==="info"){ev.preventDefault();ev.stopPropagation();S.info=b.dataset.name;render();return;}
  if(a==="info-close"){S.info=null;render();return;}
  switch(a){
    case "tab":S.tab=b.dataset.v;S.confirmReset=false;if(S.tab==="cal")S.calMonth=S.date.slice(0,7);render();window.scrollTo(0,0);return;
    case "prev":SW=null;S.date=addDays(d,-1);break;
    case "next":SW=null;S.date=addDays(d,1);break;
    case "today":S.date=todayKey();break;
    case "goto":S.date=b.dataset.d;if(S.tab!=="today"){S.tab="today";render();window.scrollTo(0,0);return;}break;
    case "type":e=ensureEntry(d);e.type=b.dataset.v;if(e.type==="gym"&&e.gtpl===undefined&&!(e.gym||[]).some(gHas)){var sgg=suggest(d).gym;loadGym(e,sgg?sgg.t:null);}touch(d);break;
    case "use-gym":var sgy=suggest(d).gym;if(!sgy)return;e=ensureEntry(d);e.type="gym";if(e.gtpl!==sgy.t.id)loadGym(e,sgy.t);touch(d);break;
    case "sw-start":if(SW)swStop(d);swStart(d,b.dataset.ex,b.dataset.mode);break;
    case "sw-stop":swStop(d);break;
    case "sess-start":e=ensureEntry(d);e.sess={start:Date.now()};touch(d);break;
    case "sess-finish":e=ensureEntry(d);e.sess=e.sess||{};e.sess.end=Date.now();
      e.sess.min=e.sess.start?Math.max(1,Math.round((e.sess.end-e.sess.start)/60000)):null;
      if(e.type==="climb"&&e.sess.min&&!(e.climb&&filled(e.climb.min))){e.climb=e.climb||{};e.climb.min=e.sess.min;}
      touch(d);flushNow(mkey(d));render();var sc=document.getElementById("sess");if(sc)sc.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return;
    case "sess-reopen":e=ensureEntry(d);if(e.sess){e.sess.end=null;e.sess.min=null;}touch(d);break;
    case "use-tpl":var sg=suggest(d);e=ensureEntry(d);e.type="home";e.tpl=sg.t.id;touch(d);break;
    case "st-all":e=ensureEntry(d);e.st=e.st||{};stretchList(d,e).forEach(function(s){e.st[s.name]=true;});touch(d);break;
    case "gadd":e=ensureEntry(d);e.gym=e.gym||[];e.gym.push({name:"",sets:[{w:"",r:""},{w:"",r:""},{w:"",r:""}]});touch(d);render();var ins=root.querySelectorAll('[data-in="gname"]');if(ins.length)ins[ins.length-1].focus();return;
    case "gdel":e=ensureEntry(d);e.gym.splice(+b.dataset.i,1);touch(d);break;
    case "gaddset":e=ensureEntry(d);var g=e.gym[+b.dataset.i];var ls=g.sets[g.sets.length-1]||{};g.sets.push({w:ls.w||"",r:""});touch(d);break;
    case "gdelset":e=ensureEntry(d);e.gym[+b.dataset.i].sets.splice(+b.dataset.j,1);touch(d);break;
    case "cal-prev":case "cal-next":var f=parse(S.calMonth+"-01");f.setMonth(f.getMonth()+(a==="cal-prev"?-1:1));S.calMonth=key(f).slice(0,7);break;
    case "ptpl":S.progTpl=b.dataset.v;S.confirmReset=false;break;
    case "pex-add":tplById(S.progTpl).ex.push(isGymTpl(S.progTpl)?G("x"+Date.now().toString(36),"New exercise",3,8,12,0,5):X("x"+Date.now().toString(36),"New exercise",3,8,12,"reps",0));persist("program");render();var ni=root.querySelectorAll('[data-in="pex"][data-f="name"]');if(ni.length){ni[ni.length-1].focus();ni[ni.length-1].select();}return;
    case "pex-del":case "pex-up":case "pex-down":var r=exById(b.dataset.id);if(!r)return;
      if(a==="pex-del")r.p.ex.splice(r.i,1);else{var j=r.i+(a==="pex-up"?-1:1);if(j<0||j>=r.p.ex.length)return;var tmp=r.p.ex[j];r.p.ex[j]=r.x;r.p.ex[r.i]=tmp;}
      persist("program");break;
    case "pst-add":editList().push(T(S.progTpl==="daily"?"New item":"New stretch","60s"));persist("program");break;
    case "pst-del":editList().splice(+b.dataset.i,1);persist("program");break;
    case "reset":S.confirmReset=true;break;
    case "reset-no":S.confirmReset=false;break;
    case "reset-yes":var u=S.program.unit;S.program=defaultProgram();S.program.unit=u;S.confirmReset=false;persist("program");break;
    default:return;
  }
  render();
});

root.addEventListener("change",function(ev){
  var t=ev.target,c=t.dataset.ch;if(!c)return;var d=S.date,e;
  switch(c){
    case "run":e=ensureEntry(d);e.run=t.checked;touch(d);break;
    case "min":e=ensureEntry(d);e.min=t.checked;touch(d);break;
    case "also":e=ensureEntry(d);e.alsoHome=t.checked;touch(d);break;
    case "tpl":e=ensureEntry(d);e.tpl=t.value;touch(d);break;
    case "gtpl":e=ensureEntry(d);loadGym(e,gtplById(t.value));touch(d);break;
    case "gsub":e=ensureEntry(d);e.gym[+t.dataset.i].name=t.value;touch(d);break;
    case "st":e=ensureEntry(d);e.st=e.st||{};e.st[t.dataset.name]=t.checked;touch(d);break;
    case "sub":e=ensureEntry(d);var x=planEx(d,t.dataset.ex,t.dataset.mode);if(!x)return;recFor(d,e,x,t.dataset.mode).name=t.value;touch(d);break;
    case "pex-unit":var r=exById(t.dataset.id);if(r){r.x.unit=t.value;persist("program");}return;
    case "pex-side":r=exById(t.dataset.id);if(r){r.x.side=t.checked;persist("program");}return;
    case "unit":S.program.unit=t.value;persist("program");return;
    default:return;
  }
  render();
});

root.addEventListener("input",function(ev){
  var t=ev.target,k=t.dataset.in;if(!k)return;var d=S.date,e;
  switch(k){
    case "set":e=ensureEntry(d);var x=planEx(d,t.dataset.ex,t.dataset.mode);if(!x)return;var r=recFor(d,e,x,t.dataset.mode);while(r.sets.length<x.sets)r.sets.push(null);r.sets[+t.dataset.i]=t.value===""?null:Number(t.value);autoStart(d,e);touch(d);
      var fb=document.getElementById("fb-"+t.dataset.mode+x.id);if(fb){var f=feedback(x,r);fb.className="fb"+(f?" "+f.k:"");fb.textContent=f?f.t:"";fb.hidden=!f;}
      break;
    case "climb":e=ensureEntry(d);e.climb=e.climb||{};var f=t.dataset.f;e.climb[f]=f==="min"?(t.value===""?null:Number(t.value)):t.value;touch(d);break;
    case "gname":e=ensureEntry(d);var gi=+t.dataset.i;e.gym[gi].name=t.value;touch(d);
      var hint=document.getElementById("gh-"+gi);if(hint){var l=lastGym(t.value,d);hint.textContent=l?"Last time ("+fmtShort(l.d)+"): "+gymText(l.sets):(t.value?"First time logging this.":"");}break;
    case "gset":e=ensureEntry(d);var gg=e.gym[+t.dataset.i],s=gg.sets[+t.dataset.j];s[t.dataset.f]=t.value===""?"":Number(t.value);autoStart(d,e);touch(d);
      var gfb=document.getElementById("gfb-"+t.dataset.i);if(gfb){var gf=gymFeedback(gg.ref?gymEx(gg.ref):null,gg);gfb.className="fb"+(gf?" "+gf.k:"");gfb.textContent=gf?gf.t:"";gfb.hidden=!gf;}
      break;
    case "ptpl":tplById(S.progTpl)[t.dataset.f]=t.value;persist("program");break;
    case "pex":var pr=exById(t.dataset.id);if(!pr)return;var pf=t.dataset.f;
      if(pf==="easier"||pf==="harder"||pf==="other")pr.x[pf]=t.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
      else if(pf==="name")pr.x.name=t.value;
      else if(pf==="inc"){var iv=parseFloat(t.value);if(isNaN(iv))return;pr.x.inc=Math.max(0,wUnit()==="kg"?iv*2:iv);}
      else{var n=parseInt(t.value,10);if(isNaN(n))return;if(pf==="sets")n=Math.max(1,Math.min(10,n));pr.x[pf]=Math.max(0,n);}
      persist("program");break;
    case "pst":editList()[+t.dataset.i][t.dataset.f]=t.value;persist("program");break;
  }
});

/* test hook for offline checks; harmless in the page */
window.__cali={swStart:function(d,i,m){swStart(d,i,m);},swStop:function(d){swStop(d);},sw:function(){return SW;},guideFor:function(n){return guideFor(n);},S:S,render:render,gymFeedback:function(x,g){return gymFeedback(x,g);},gymEx:function(i){return gymEx(i);},normalize:function(p){return normalizeProgram(p);},feedback:function(x,r){return feedback(x,r);},suggest:function(d){SC={};HC=null;return suggest(d);}};

render();
initStore();
})();
</script>
